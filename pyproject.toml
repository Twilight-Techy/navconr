[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "navconr"
version = "0.1.0rc1"
description = "Bounded knowledge navigation with immutable, exact source evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "markdown-it-py>=3,<5", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/Twilight-Techy/navconr"
Issues = "https://github.com/Twilight-Techy/navconr/issues"

[project.optional-dependencies]
formats = ["pypdf>=5,<7", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "tree-sitter>=0.24,<0.26", "tree-sitter-typescript>=0.23,<0.24"]
search = ["numpy>=2,<3", "scikit-learn>=1.5,<2"]
embeddings = ["sentence-transformers>=3,<6"]
mcp = ["mcp>=1.20,<2"]
langgraph = ["langgraph>=1,<2"]
research = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1", "build>=1,<2", "mypy>=1.14,<2", "hatchling>=1.25,<2"]

[project.scripts]
navconr = "navconr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/navconr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", "viewer/src", "viewer/index.html", "viewer/package.json", "viewer/package-lock.json", "viewer/tsconfig.json", "viewer/vite.config.ts", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml", "Makefile", "uv.lock", "benchmarks/create_fixtures.py", "benchmarks/dataset.json", "benchmarks/corpus", "LICENSE_STATUS.md"]

[tool.hatch.build]
artifacts = ["src/navconr/_viewer/**"]

name: checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,formats,search,mcp,langgraph]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/navconr
      - run: pytest -q
      - run: python -m build
      - run: navconr ingest examples/corpus --db /tmp/navconr.sqlite
      - run: navconr query 'refresh token revocation' --db /tmp/navconr.sqlite
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
